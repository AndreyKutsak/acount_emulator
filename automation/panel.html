<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Control Panel</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --border:#2a313c;
    --fg:#e6edf3; --muted:#8b949e; --accent:#3b82f6; --accent2:#2563eb;
    --ok:#22c55e; --danger:#ef4444; --rec:#f43f5e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .pill{font-size:12px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--border);padding:3px 9px;border-radius:999px}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:6px}
  header .dot.on{background:var(--ok)}
  .wrap{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
  .screen{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;
    display:flex;flex-direction:column;gap:10px;align-items:center}
  #screenImg{width:270px;max-width:72vw;height:auto;border-radius:10px;border:1px solid var(--border);
    cursor:crosshair;background:#000;display:block}
  .screen .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .controls{flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .card h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .grid{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;padding:8px 12px;cursor:pointer;transition:.12s}
  button:hover{border-color:var(--accent);background:#222b36}
  button.primary{background:var(--accent2);border-color:var(--accent2)}
  button.primary:hover{background:var(--accent)}
  button.rec{background:var(--rec);border-color:var(--rec)}
  input,select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;min-width:0}
  input{flex:1}
  label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .steps{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto;font-size:13px}
  .steps li{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border:1px solid var(--border);
    border-radius:7px;margin-bottom:6px;background:var(--panel2)}
  .steps li span.k{color:var(--accent)}
  .muted{color:var(--muted)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:#111826;border:1px solid var(--border);border-radius:8px;padding:9px 14px;
    opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
  #toast.show{opacity:1}
  #toast.err{border-color:var(--danger)}
</style>
</head>
<body>
<header>
  <h1>📱 Android Control Panel</h1>
  <span class="pill" id="deviceInfo">—</span>
  <span class="pill"><span class="dot" id="curDot"></span><span id="curApp">—</span></span>
  <span class="pill muted" id="bridgeUrl"></span>
</header>

<div class="wrap">
  <!-- LIVE SCREEN -->
  <div class="screen">
    <img id="screenImg" alt="екран" title="клік = тап по цьому місцю">
    <div class="row">
      <label class="chk"><input type="checkbox" id="liveChk" checked> live</label>
      <button id="refreshBtn">↻ Оновити</button>
    </div>
    <div class="row">
      <button data-press="back">◀ Back</button>
      <button data-press="home">● Home</button>
      <button data-press="recent">■ Recent</button>
    </div>
    <div class="row">
      <button data-swipe="up">↑</button>
      <button data-swipe="down">↓</button>
      <button data-swipe="left">←</button>
      <button data-swipe="right">→</button>
      <button data-press="enter">⏎ Enter</button>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="card">
      <h2>Ввід тексту</h2>
      <div class="grid">
        <input id="typeInput" placeholder="текст для вводу в активне поле">
        <button class="primary" id="typeBtn">Ввести</button>
      </div>
    </div>

    <div class="card">
      <h2>Застосунки</h2>
      <div class="grid" style="margin-bottom:8px">
        <select id="appSelect" style="flex:1"></select>
        <button id="launchBtn" class="primary">Запустити</button>
        <button id="stopBtn">Стоп</button>
      </div>
      <div class="grid">
        <label class="chk"><input type="checkbox" id="allAppsChk"> показати всі</label>
        <button id="reloadApps">↻ список</button>
      </div>
    </div>

    <div class="card">
      <h2>Встановити APK</h2>
      <div class="grid">
        <input id="apkInput" placeholder="C:\\шлях\\app.apk  або  https://…/app.apk">
        <button class="primary" id="installBtn">Встановити</button>
      </div>
      <div class="muted" style="margin-top:6px;font-size:12px">x86_64-образ: потрібен x86/universal APK (ARM-only не стане)</div>
    </div>

    <!-- NO-CODE RECORDER -->
    <div class="card">
      <h2>Запис дій (no-code автоматизація)</h2>
      <div class="grid" style="margin-bottom:10px">
        <button id="recBtn">● Почати запис</button>
        <button class="primary" id="replayBtn">▶ Повторити</button>
        <button id="clearBtn">Очистити</button>
        <button id="exportBtn">⬇ JSON</button>
        <label class="chk">пауза <input id="delayInput" type="number" value="1000" style="width:72px"> мс</label>
      </div>
      <ol class="steps" id="stepsList"></ol>
      <div class="muted" id="stepsHint" style="font-size:12px">Увімкни запис і просто користуйся панеллю — кожна дія запишеться. Потім «Повторити».</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = location.origin;              // панель віддається самим мостом → той самий origin
document.getElementById('bridgeUrl').textContent = API;

let recording = false;
const steps = [];

// ---- helpers ----
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='', 2200);
}
async function api(method, path, body){
  const r = await fetch(API+path, {
    method,
    headers: body ? {'Content-Type':'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!r.ok){
    let d=r.statusText; try{ d=(await r.json()).detail||d; }catch{}
    throw new Error(d);
  }
  return r.headers.get('content-type')?.includes('json') ? r.json() : r;
}
// запис кроку, якщо увімкнено
function record(action, params){
  if(!recording) return;
  steps.push({action, params:params||{}});
  renderSteps();
}
function renderSteps(){
  const ol = document.getElementById('stepsList');
  ol.innerHTML = '';
  steps.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML = `<span><span class="k">${s.action}</span> ${JSON.stringify(s.params)}</span>`
      + `<button data-del="${i}">✕</button>`;
    ol.appendChild(li);
  });
  document.getElementById('stepsHint').style.display = steps.length? 'none':'block';
}

// ---- actions (кожна і виконує, і записує) ----
async function doPress(key){ await api('POST','/press',{key}); record('press',{key}); refresh(); }
async function doSwipe(direction){ await api('POST','/swipe',{direction}); record('swipe',{direction}); refresh(); }
async function doTap(x,y){ await api('POST','/tap',{x,y}); record('tap',{x,y}); refresh(); }
async function doType(text){ await api('POST','/type',{text}); record('type',{text}); refresh(); }
async function doStart(pkg){ await api('POST','/app/start',{package:pkg}); record('app_start',{package:pkg}); refresh(); }
async function doStop(pkg){ await api('POST','/app/stop',{package:pkg}); record('app_stop',{package:pkg}); }
async function doInstall(source){ await api('POST','/app/install',{source}); record('install',{source}); }

// ---- live screen ----
let liveTimer=null;
async function refresh(){
  try{
    const r = await fetch(API+'/screenshot?ts='+Date.now());
    if(!r.ok) return;
    const blob = await r.blob();
    const img = document.getElementById('screenImg');
    const old = img.src;
    img.src = URL.createObjectURL(blob);
    if(old.startsWith('blob:')) URL.revokeObjectURL(old);
  }catch{}
}
function setLive(on){
  clearInterval(liveTimer);
  if(on){ refresh(); liveTimer=setInterval(refresh, 900); }
}

// клік по екрану → тап у координатах пристрою
document.getElementById('screenImg').addEventListener('click', e=>{
  const img=e.target, rect=img.getBoundingClientRect();
  if(!img.naturalWidth) return;
  const x=Math.round((e.clientX-rect.left)/rect.width * img.naturalWidth);
  const y=Math.round((e.clientY-rect.top)/rect.height * img.naturalHeight);
  doTap(x,y).catch(err=>toast(err.message,true));
});

// ---- wire controls ----
document.querySelectorAll('[data-press]').forEach(b=>
  b.onclick=()=>doPress(b.dataset.press).catch(err=>toast(err.message,true)));
document.querySelectorAll('[data-swipe]').forEach(b=>
  b.onclick=()=>doSwipe(b.dataset.swipe).catch(err=>toast(err.message,true)));
document.getElementById('refreshBtn').onclick=refresh;
document.getElementById('liveChk').onchange=e=>setLive(e.target.checked);

document.getElementById('typeBtn').onclick=()=>{
  const v=document.getElementById('typeInput').value;
  if(v) doType(v).then(()=>toast('введено')).catch(err=>toast(err.message,true));
};
document.getElementById('launchBtn').onclick=()=>{
  const p=document.getElementById('appSelect').value;
  if(p) doStart(p).then(()=>toast('запущено '+p)).catch(err=>toast(err.message,true));
};
document.getElementById('stopBtn').onclick=()=>{
  const p=document.getElementById('appSelect').value;
  if(p) doStop(p).then(()=>toast('зупинено '+p)).catch(err=>toast(err.message,true));
};
document.getElementById('installBtn').onclick=()=>{
  const s=document.getElementById('apkInput').value.trim();
  if(!s) return;
  toast('встановлення…');
  doInstall(s).then(()=>{toast('встановлено'); loadApps();}).catch(err=>toast(err.message,true));
};
document.getElementById('reloadApps').onclick=loadApps;
document.getElementById('allAppsChk').onchange=loadApps;

// ---- recorder ----
document.getElementById('recBtn').onclick=function(){
  recording=!recording;
  this.textContent = recording ? '⏸ Зупинити запис' : '● Почати запис';
  this.classList.toggle('rec', recording);
  toast(recording?'запис увімкнено':'запис вимкнено');
};
document.getElementById('clearBtn').onclick=()=>{ steps.length=0; renderSteps(); };
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(steps,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='android-flow.json'; a.click();
};
document.getElementById('stepsList').onclick=e=>{
  const i=e.target.dataset?.del;
  if(i!=null){ steps.splice(+i,1); renderSteps(); }
};
document.getElementById('replayBtn').onclick=async()=>{
  const delay=+document.getElementById('delayInput').value||800;
  const wasRec=recording; recording=false;           // під час повтору не записуємо
  const map={press:'/press',swipe:'/swipe',tap:'/tap',type:'/type',
             app_start:'/app/start',app_stop:'/app/stop',install:'/app/install'};
  toast('повтор '+steps.length+' кроків…');
  for(const s of steps){
    try{ await api('POST',map[s.action],s.params); }catch(err){ toast('крок '+s.action+': '+err.message,true); }
    await refresh(); await new Promise(r=>setTimeout(r,delay));
  }
  recording=wasRec; toast('повтор завершено');
};

// ---- apps + header ----
async function loadApps(){
  try{
    const all=document.getElementById('allAppsChk').checked;
    const d=await api('GET','/apps?third_party='+(all?'false':'true'));
    const sel=document.getElementById('appSelect');
    const cur=sel.value;
    sel.innerHTML='';
    (d.packages||[]).sort().forEach(p=>{
      const o=document.createElement('option'); o.value=o.textContent=p; sel.appendChild(o);
    });
    if(cur) sel.value=cur;
  }catch(err){ toast(err.message,true); }
}
async function pollHeader(){
  try{
    const h=await api('GET','/health');
    document.getElementById('curDot').classList.toggle('on', h.connected);
    document.getElementById('curApp').textContent=h.current||(h.connected?'—':'не підключено');
    if(h.connected && document.getElementById('deviceInfo').textContent==='—'){
      const i=await api('GET','/info');
      document.getElementById('deviceInfo').textContent=
        `${i.model} · Android ${i.android_version} · ${i.width}×${i.height} · ${i.arch}`;
    }
  }catch{}
}

// ---- init ----
setLive(true);
loadApps();
pollHeader(); setInterval(pollHeader, 2500);
renderSteps();
</script>
</body>
</html>
